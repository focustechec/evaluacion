<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación – Focus Talento Humano</title>

<!-- Logo en la pestaña, en el celular y al instalar como app -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0B0C">

<!-- Vista previa al compartir el link (WhatsApp, Teams, etc.) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Evaluación – Focus Talento Humano">
<meta property="og:description" content="Evaluación en línea de tu proceso de selección.">
<meta property="og:url" content="https://evaluacion.focustechinc.net/">
<meta property="og:image" content="https://evaluacion.focustechinc.net/icon-512.png">
<meta name="twitter:card" content="summary">

<style>
  html, body { margin: 0; height: 100%; background: #ECECEC; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<iframe id="evaluacion" title="Evaluación"></iframe>
<script>
  var BASE = 'https://script.google.com/macros/s/AKfycbyxsuNKToipo7umi3vt60KRjV4mCeCxRsoKswBwApzkzcvCcxt1dpTzzFKDP9WkX6x2QA/exec';
  var p = new URLSearchParams(location.search);
  var token = p.get('eval') || sessionStorage.getItem('eval_token') || '';
  if (p.get('eval')) {
    try { sessionStorage.setItem('eval_token', token); } catch (e) {}
    history.replaceState(null, '', location.pathname);
  }
  document.getElementById('evaluacion').src = BASE + '?eval=' + encodeURIComponent(token);
</script>
</body>
</html>
